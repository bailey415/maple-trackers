<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXP Tracker</title>
<style>
  :root {
    --page: #2a2118;
    --card: #fff8ec;
    --ink: #140d07;
    --muted: #2b1e12;
    --head: #6b4423;
    --head2: #4f301a;
    --orange: #f29a1f;
    --orange-dark: #c8740a;
    --line: #ead9bf;
    --bar-bg: #e3d6c2;
    --exp1: #c8e03a;
    --exp2: #8fb613;
    --green: #3fbf5a;
    --grey: #a99b8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--page); color: var(--ink);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--card); border-radius: 14px;
    overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .head {
    background: linear-gradient(var(--head), var(--head2)); color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  }
  .lv {
    background: var(--orange); border: 2px solid #ffd08a; border-radius: 8px;
    min-width: 54px; padding: 3px 6px; text-align: center; cursor: pointer; line-height: 1.1;
  }
  .lv small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; opacity: .9; }
  .lv b { font-size: 20px; }
  .who { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
  .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .body { padding: 16px; }
  .exprow { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .exprow span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { height: 12px; background: var(--bar-bg); border-radius: 6px; overflow: hidden; border: 1px solid #d3c2a6; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(var(--exp1), var(--exp2)); transition: width .6s; }
  .spark { margin: 16px 0 4px; height: 56px; width: 100%; display: block; }
  .caption { font-size: 13px; color: var(--muted); }
  .big { margin: 14px 0 2px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .big b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
  .big span { font-size: 15px; font-weight: 600; color: var(--orange-dark); }
  .sub { font-size: 13px; color: var(--muted); min-height: 18px; }
  .tabs, .wins { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .tabs button, .wins button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600;
  }
  .tabs button { flex: 1; border-radius: 8px; }
  .tabs button.on, .wins button.on {
    background: var(--orange); border-color: var(--orange-dark); color: #fff;
  }
  .wins button { font-size: 12px; padding: 4px 10px; }
  .ups { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .ups div { padding: 3px 0; border-top: 1px dashed var(--line); }
  .foot { padding: 10px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .edit { display: none; gap: 6px; margin-top: 6px; }
  .edit.show { display: flex; }
  .edit input { font: inherit; width: 100%; padding: 4px 6px; border-radius: 6px; border: 1px solid #ffd08a; }
  .edit button { font: inherit; border: 0; border-radius: 6px; background: var(--orange); color: #fff; padding: 4px 10px; cursor: pointer; }
  .hint { color: #ffd08a; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="lv" id="lv" title="Click to set your level"><small>LV</small><b id="lvn">?</b></div>
    <div class="who">
      <div class="name" id="name" title="Click to rename">…</div>
      <div class="status"><span class="dot" id="dot"></span><span id="stat">Waiting for game</span></div>
      <div class="edit" id="edit">
        <input id="editIn" autocomplete="off"><button id="editOk">Save</button>
      </div>
    </div>
  </div>
  <div class="body">
    <div class="exprow"><span>EXP</span><span id="exptxt">—</span></div>
    <div class="bar"><i id="fill"></i></div>

    <svg class="spark" id="spark" viewBox="0 0 400 56" preserveAspectRatio="none"></svg>
    <div class="caption" id="caption">—</div>

    <div class="big"><b id="bigv">—</b><span id="bigs"></span></div>
    <div class="sub" id="sub"></div>
    <div class="wins" id="wins"></div>
    <div class="ups" id="ups"></div>

    <div class="tabs" id="tabs">
      <button data-tab="rate" class="on">EXP/hour</button>
      <button data-tab="today">Today's EXP</button>
      <button data-tab="level">Level</button>
    </div>
  </div>
  <div class="foot"><span>updates every 30s</span><span id="ago"></span></div>
</div>

<script>
const WINS = [5, 10, 15, 30];
let tab = "rate", win = 10, S = null, editing = null;
try { tab = localStorage.getItem("tab") || tab; win = +localStorage.getItem("win") || win; } catch (e) {}

const $ = id => document.getElementById(id);
function short(n) {
  if (n == null || !isFinite(n)) return "—";
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e9) return s + (a / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "M";
  if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + "K";
  return s + Math.round(a);
}
const comma = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
function dur(s) {
  if (s == null || !isFinite(s) || s < 0) return null;
  s = Math.round(s / 60);
  const d = Math.floor(s / 1440), h = Math.floor(s % 1440 / 60), m = s % 60;
  if (d) return `${d}d ${h}h`;
  return h ? `${h}h ${m}m` : `${m}m`;
}
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function spark(vals) {
  const svg = $("spark");
  if (!vals || vals.length < 2) { svg.innerHTML = ""; return; }
  const W = 400, H = 56, p = 3;
  const lo = Math.min(0, ...vals), hi = Math.max(...vals, lo + 1);
  const pts = vals.map((v, i) => [i * W / (vals.length - 1), H - p - (v - lo) / (hi - lo) * (H - 2 * p)]);
  const line = pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  svg.innerHTML =
    `<defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
       <stop offset="0" stop-color="#f29a1f" stop-opacity=".35"/><stop offset="1" stop-color="#f29a1f" stop-opacity="0"/></linearGradient></defs>
     <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#g)"/>
     <path d="${line}" fill="none" stroke="#e0850c" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
}

function render() {
  if (!S) return;
  $("lvn").textContent = S.level ?? "?";
  $("lv").title = S.level ? "Click to change your level" : "Click to set your level";
  $("name").textContent = S.name || "My character";
  $("dot").className = "dot" + (S.on_screen ? " on" : "");
  $("stat").textContent = S.on_screen ? "On screen" : (!S.window ? "Game window not found" : "Game found — can't see the EXP bar");
  $("exptxt").textContent = S.exp == null ? "—" : `${comma(S.exp)} [${S.pct.toFixed(2)}%]`;
  $("fill").style.width = (S.pct || 0) + "%";

  const r = S.rates[win] || {};
  const eta = dur(r.eta_s);
  $("caption").textContent = `${short(S.today.exp)} today` + (eta ? ` · next level in ${eta}` : "");

  $("wins").style.display = tab === "rate" ? "" : "none";
  $("wins").innerHTML = WINS.map(m => `<button data-win="${m}" class="${m === win ? "on" : ""}">last ${m}m</button>`).join("");
  $("ups").innerHTML = "";

  if (tab === "rate") {
    $("bigv").textContent = short(r.exp_h);
    $("bigs").textContent = r.pct_h == null ? "" : r.pct_h.toFixed(2) + "%/h";
    $("sub").textContent = r.exp_h == null
      ? "Collecting data — play for a minute"
      : `${comma(r.gain)} EXP over ${Math.max(1, Math.round(r.minutes))} min of play`;
    spark(S.rate_spark);
  } else if (tab === "today") {
    $("bigv").textContent = short(S.today.exp);
    $("bigs").textContent = S.today.pct == null ? "" : S.today.pct.toFixed(2) + "% of a level";
    const played = dur(S.today.minutes * 60);
    $("sub").textContent = `${comma(S.today.exp)} EXP` + (played ? ` · ${played} played today` : "");
    spark(S.today.spark);
  } else {
    $("bigv").textContent = S.level ?? "?";
    $("bigs").textContent = S.pct == null ? "" : S.pct.toFixed(2) + "%";
    const left = S.need && S.exp != null ? S.need - S.exp : null;
    $("sub").textContent = left == null ? "Set your level by clicking the LV badge"
      : `${comma(left)} EXP to level ${S.level ? S.level + 1 : "up"}` + (eta ? ` · about ${eta} at the last-${win}m pace` : "");
    const ups = S.today.levelups;
    $("ups").innerHTML = ups.length
      ? "<div><b>Level-ups today</b></div>" + ups.slice().reverse().map(u => `<div>${clock(u.t)} — reached LV ${u.level ?? "+1"}</div>`).join("")
      : "";
    spark(S.today.spark);
  }
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  tickAgo();
}

function tickAgo() {
  if (!S || !S.last_seen) { $("ago").textContent = ""; return; }
  const s = Math.max(0, Math.round(Date.now() / 1000 - S.last_seen));
  $("ago").textContent = s < 5 ? "reading live" : `last read ${dur(s) && s >= 60 ? dur(s) : s + "s"} ago`;
}

async function load() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    S = await res.json();
    render();
  } catch (e) {
    $("stat").textContent = "Tracker not running";
    $("dot").className = "dot";
  }
}

$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch (_) {}
  render();
};
$("wins").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  win = +b.dataset.win; try { localStorage.setItem("win", win); } catch (_) {}
  render();
};
function openEdit(what) {
  editing = what;
  $("edit").classList.add("show");
  $("editIn").type = what === "level" ? "number" : "text";
  $("editIn").placeholder = what === "level" ? "Your level, e.g. 45" : "Character name";
  $("editIn").value = what === "level" ? (S && S.level || "") : (S && S.name || "");
  $("editIn").focus(); $("editIn").select();
}
async function saveEdit() {
  const v = $("editIn").value.trim();
  if (v) {
    await fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(editing === "level" ? { level: +v } : { name: v }) });
  }
  $("edit").classList.remove("show");
  load();
}
$("lv").onclick = () => openEdit("level");
$("name").onclick = () => openEdit("name");
$("editOk").onclick = saveEdit;
$("editIn").onkeydown = e => { if (e.key === "Enter") saveEdit(); if (e.key === "Escape") $("edit").classList.remove("show"); };

load();
setInterval(load, 30000);
setInterval(tickAgo, 1000);
</script>
</body>
</html>
