name: Build Windows apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: python -m pip install pyinstaller mss opencv-python-headless numpy pywin32

      - name: Build MapleTracker.exe
        working-directory: maple tracker
        run: python -m PyInstaller --onefile --noconfirm --name MapleTracker --paths "../exp tracker" --paths "../mesos tracker" --hidden-import exp_tracker --hidden-import meso_tracker --add-data "dashboard.html;." maple_tracker.py

      - name: Package zip
        shell: pwsh
        run: |
          $out = "release/Maple Tracker"
          New-Item -ItemType Directory -Force "$out" | Out-Null
          Copy-Item "maple tracker/dist/MapleTracker.exe" "$out/"
          Copy-Item "mesos tracker/meso_font.json" "$out/"
          Copy-Item "packaging/HOW-TO-USE.txt" "$out/"
          Compress-Archive -Path "$out" -DestinationPath "release/MapleTrackers.zip" -Force

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest "release/MapleTrackers.zip" --title "Maple Trackers (Windows)" --notes "Download MapleTrackers.zip, unzip it, and double-click MapleTracker.exe. EXP and mesos on one dashboard. No Python needed. See HOW-TO-USE.txt inside."
